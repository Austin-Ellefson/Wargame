name: Verify campaign and tactical battle

on:
  push:
    branches: ["codex/integrated-tactical-battle"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  game:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri
          python3 -m pip install pytest -r terrain_bridge/requirements.txt
          curl -fL --retry 3 -o "$RUNNER_TEMP/godot.zip" https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.5.1-stable_linux.x86_64"
      - name: GIS regression tests
        run: python3 -m pytest -q tests/test_terrain_bridge.py
      - name: Godot logic and rendered input checks
        run: |
          xvfb-run -a python3 tests/run_godot_checks.py --godot "$RUNNER_TEMP/godot/Godot_v4.5.1-stable_linux.x86_64" --render-check --capture "$RUNNER_TEMP/tactical-preview.png" --logs-dir "$RUNNER_TEMP/godot-logs"
      - name: Save render and test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tactical-validation
          path: |
            ${{ runner.temp }}/tactical-preview.png
            ${{ runner.temp }}/godot-logs/
